# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - demo-docker-app

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://demodockeracr.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_dbc2c7bb773e45cc93b9c888f8a871c0 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_abafae9c2d464dd491e1d8087dec31f3 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: demodockeracr.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_dbc2c7bb773e45cc93b9c888f8a871c0 }}/demo-docker-app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'demo-docker-app'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_0848826d5d2f49c994506d5388298889 }}
        images: 'demodockeracr.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_dbc2c7bb773e45cc93b9c888f8a871c0 }}/demo-docker-app:${{ github.sha }}'