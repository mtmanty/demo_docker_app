name: Trigger auto deployment for demo-docker-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/demo-docker-app-AutoDeployTrigger-5077ab07-afd6-4cd5-9d8a-d1aa5ca6bee7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.DEMODOCKERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMODOCKERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMODOCKERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: demodockeracr.azurecr.io
          registryUsername: ${{ secrets.DEMODOCKERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMODOCKERAPP_REGISTRY_PASSWORD }}
          containerAppName: demo-docker-app
          resourceGroup: demo-docker-app
          imageToBuild: demodockeracr.azurecr.io/demo-docker-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


